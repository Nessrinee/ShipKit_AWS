# nginx-ssl/docker-compose.yml
# Production Nginx + Certbot with automatic SSL renewal
# Usage: DOMAIN=yourdomain.com EMAIL=you@email.com docker compose up -d

version: "3.9"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-ssl
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
      - nginx-logs:/var/log/nginx
    healthcheck:
      test:     ["CMD", "nginx", "-t"]
      interval: 30s
    networks:
      - web

  certbot:
    image: certbot/certbot:v2.9.0
    container_name: certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    # Renew every 12 hours; certbot only acts if cert expires within 30 days
    entrypoint: >
      /bin/sh -c 'trap exit TERM;
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet;
          sleep 12h & wait $${!};
        done'
    networks:
      - web

volumes:
  certbot-www:
  certbot-certs:
  nginx-logs:

networks:
  web:
    driver: bridge
