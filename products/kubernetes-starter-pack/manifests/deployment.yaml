---
# deployment.yaml — Production-grade Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: production
  labels:
    app: app
    version: "1.0.0"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge:       1
      maxUnavailable: 0   # Zero-downtime deploys
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
      annotations:
        # Force pod restart on configmap change
        checksum/config: "{{ .Values.configChecksum | default 'init' }}"
    spec:
      serviceAccountName: app-sa
      automountServiceAccountToken: false

      # Security hardening
      securityContext:
        runAsNonRoot: true
        runAsUser:    1000
        runAsGroup:   1000
        fsGroup:      2000
        seccompProfile:
          type: RuntimeDefault

      # Spread pods across nodes and zones
      topologySpreadConstraints:
        - maxSkew:           1
          topologyKey:       kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: app

      containers:
        - name: app
          image: "your-registry/your-app:1.0.0"   # ← change this
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http

          # Security context per container
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem:   true
            capabilities:
              drop: ["ALL"]

          # Resource limits (tune to your app)
          resources:
            requests:
              cpu:    "100m"
              memory: "128Mi"
            limits:
              cpu:    "500m"
              memory: "512Mi"

          # Environment from Kubernetes secrets + configmaps
          envFrom:
            - secretRef:
                name: app-secrets
            - configMapRef:
                name: app-config

          # Health probes
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds:       5
            failureThreshold:    3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds:       15
            failureThreshold:    3

          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds:     5

          # Writable temp dirs (read-only root fs)
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.cache

      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}

      terminationGracePeriodSeconds: 30
---
# service.yaml
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: production
spec:
  selector:
    app: app
  ports:
    - port:       80
      targetPort: http
      protocol:   TCP
  type: ClusterIP
---
# ingress.yaml — Nginx Ingress with cert-manager TLS
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  namespace: production
  annotations:
    kubernetes.io/ingress.class:              "nginx"
    cert-manager.io/cluster-issuer:           "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Rate limit at ingress level
    nginx.ingress.kubernetes.io/limit-rps:    "30"
    nginx.ingress.kubernetes.io/limit-connections: "20"
spec:
  tls:
    - hosts:
        - yourdomain.com        # ← change this
      secretName: app-tls
  rules:
    - host: yourdomain.com      # ← change this
      http:
        paths:
          - path:     /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 80
