# =============================================================
# ShipKit — Production Docker Compose v2
#
# FIXES:
#   [HIGH] Resource limits changed from deploy.resources (Swarm-only)
#          to mem_limit/cpu_quota (works with standard docker compose)
#   [LOW]  healthcheck improved with wget -O /dev/null instead of -O-
#          (prevents healthcheck logs from filling docker inspect output)
# =============================================================
version: "3.9"

x-logging: &logging
  logging:
    driver: "json-file"
    options:
      max-size: "20m"
      max-file: "5"

services:

  # ── Backend ───────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: runtime
    image: shipkit-backend:latest
    container_name: shipkit-backend
    restart: unless-stopped
    <<: *logging
    env_file: ../backend/.env
    environment:
      NODE_ENV:      production
      PORT:          4000
      DATABASE_PATH: /app/data/shipkit.db
      PRODUCTS_PATH: /products
    volumes:
      - backend-data:/app/data          # SQLite persistence
      - ../products:/products:ro        # product ZIPs (read-only)
      - backend-logs:/app/logs
    expose:
      - "4000"                          # Internal only — not published to host
    networks:
      - internal
    # FIX [HIGH]: Use mem_limit/cpu_quota — these work with standard docker compose
    # deploy.resources only works in Swarm mode and is silently IGNORED otherwise
    mem_limit: 256m
    memswap_limit: 256m                 # Disable swap (same as mem_limit)
    cpu_quota: 50000                    # 50% of 1 CPU (100000 = 100%)
    cpu_period: 100000
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:4000/api/health"]
      interval: 30s
      timeout:  10s
      retries:  3
      start_period: 15s

  # ── Frontend ──────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    image: shipkit-frontend:latest
    container_name: shipkit-frontend
    restart: unless-stopped
    <<: *logging
    expose:
      - "80"
    networks:
      - internal
    mem_limit: 64m
    memswap_limit: 64m
    cpu_quota: 20000
    cpu_period: 100000
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout:  5s
      retries:  3

  # ── Nginx ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: shipkit-nginx
    restart: unless-stopped
    <<: *logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx-cache:/var/cache/nginx
      - nginx-logs:/var/log/nginx
    networks:
      - internal
    mem_limit: 64m
    memswap_limit: 64m
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test:     ["CMD", "nginx", "-t"]
      interval: 60s
      timeout:  10s
      retries:  3

volumes:
  backend-data:
  backend-logs:
  nginx-cache:
  nginx-logs:

networks:
  internal:
    driver: bridge
