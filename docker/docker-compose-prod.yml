services:

  backend:
    image: ${BACKEND_IMAGE}
    # Was: hardcoded ECR URI:latest
    # Now: comes from deploy.sh which gets it from GitHub Actions
    # GitHub Actions → SSM → deploy.sh → docker compose
    container_name: shipkit-backend
    networks:
      - shipkit-network
    expose:
      - "4000"
    volumes:
      - shipkit-db-data:/app/data
    env_file:
      - /opt/shipkit/.env
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    logging:
      driver: awslogs
      options:
        awslogs-region: eu-west-3
        awslogs-group: /shipkit/production/backend
        awslogs-stream: "{instance_id}-backend"
        awslogs-create-group: "false"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: shipkit-frontend
    networks:
      - shipkit-network
    ports:
      - "80:80"
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.25
    logging:
      driver: awslogs
      options:
        awslogs-region: eu-west-3
        awslogs-group: /shipkit/production/frontend
        awslogs-stream: "{instance_id}-frontend"
        awslogs-create-group: "false"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  shipkit-network:
    driver: bridge

volumes:
  shipkit-db-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/shipkit/data