#====================================================#
# Docker-compose Files
# version 3.9:
# Supports healthcheck condition in depends_on ✅
# Supports named volumes ✅
# Supports resource limits ✅
# Current stable format for Docker Compose v2
#====================================================#

services:
  backend:
    image: shipkit-backend:v1.0.0
    container_name: shipkit-backend
    networks:
      - shipkit-network
    ports:
      - "4000:4000"
    volumes:
      - shipkit-db-data:/app/data
    environment:
      NODE_ENV: development
      PORT: 4000
      JWT_SECRET: local-dev-secret-not-for-production
      JWT_REFRESH_SECRET: local-dev-refresh-not-for-production
      LICENSE_SECRET: local-dev-license-not-for-production
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: DevPassword123!
      CORS_ORIGIN: http://localhost
      DATABASE_PATH: /app/data/shipkit.db
      PRODUCTS_PATH: /app/products
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: shipkit-frontend:v1.0.0
    container_name: shipkit-frontend
    networks:
      - shipkit-network
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
networks:
  shipkit-network:
    driver: bridge
   
volumes:
  shipkit-db-data:
    driver: local