# =============================================================
# ShipKit — Kubernetes Manifests (Production-Ready)
# Namespace: shipkit
# Requires: kubectl apply -f k8s/
# =============================================================

---
# ── Namespace ─────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: shipkit
  labels:
    app: shipkit
    env: production

---
# ── Backend Secret (use: kubectl create secret / Sealed Secrets / Vault) ──────
# DO NOT commit real values — use external secret management
# Example: kubectl create secret generic shipkit-secrets \
#   --from-env-file=backend/.env -n shipkit
apiVersion: v1
kind: Secret
metadata:
  name: shipkit-secrets
  namespace: shipkit
type: Opaque
# stringData:  # Fill via CI/CD or external secret manager
#   JWT_SECRET: "..."
#   JWT_REFRESH_SECRET: "..."
#   LICENSE_SECRET: "..."
#   ADMIN_PASSWORD: "..."
#   ADMIN_EMAIL: "..."
#   GUMROAD_SELLER_ID: "..."
#   GUMROAD_WEBHOOK_TOKEN: "..."

---
# ── ConfigMap — non-secret config ─────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: shipkit-config
  namespace: shipkit
data:
  NODE_ENV:      "production"
  PORT:          "4000"
  DATABASE_PATH: "/app/data/shipkit.db"
  PRODUCTS_PATH: "/products"
  CORS_ORIGIN:   "https://shipkit.dev"

---
# ── PersistentVolumeClaim — SQLite database ────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shipkit-db-pvc
  namespace: shipkit
spec:
  accessModes:
    - ReadWriteOnce    # SQLite requires single-writer access
  resources:
    requests:
      storage: 1Gi
  storageClassName: standard

---
# ── Backend Deployment ─────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipkit-backend
  namespace: shipkit
  labels:
    app:       shipkit
    component: backend
    version:   "2.0.0"
spec:
  replicas: 1   # SQLite is single-writer — do NOT increase without migrating to Postgres
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge:       0     # With SQLite, bring old down BEFORE starting new
      maxUnavailable: 1
  selector:
    matchLabels:
      app:       shipkit
      component: backend
  template:
    metadata:
      labels:
        app:       shipkit
        component: backend
      annotations:
        # Prometheus scraping
        prometheus.io/scrape: "true"
        prometheus.io/port:   "4000"
        prometheus.io/path:   "/api/health"
    spec:
      serviceAccountName: shipkit-backend-sa
      automountServiceAccountToken: false

      # Security context at pod level
      securityContext:
        runAsNonRoot:    true
        runAsUser:       1001
        runAsGroup:      1001
        fsGroup:         2000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: backend
          image: "ghcr.io/YOUR_USER/shipkit-backend:latest"
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
              name: http

          # Security context at container level
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem:   true
            capabilities:
              drop: ["ALL"]

          # Resource limits — critical for cluster stability
          resources:
            requests:
              cpu:    "100m"
              memory: "128Mi"
            limits:
              cpu:    "500m"
              memory: "256Mi"

          # Config from ConfigMap (non-secret)
          envFrom:
            - configMapRef:
                name: shipkit-config

          # Secrets from Secret object
          env:
            - name:  JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shipkit-secrets
                  key:  JWT_SECRET
            - name:  JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: shipkit-secrets
                  key:  JWT_REFRESH_SECRET
            - name:  LICENSE_SECRET
              valueFrom:
                secretKeyRef:
                  name: shipkit-secrets
                  key:  LICENSE_SECRET
            - name:  ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shipkit-secrets
                  key:  ADMIN_PASSWORD
            - name:  ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: shipkit-secrets
                  key:  ADMIN_EMAIL
            - name:  GUMROAD_SELLER_ID
              valueFrom:
                secretKeyRef:
                  name: shipkit-secrets
                  key:  GUMROAD_SELLER_ID
            - name:  GUMROAD_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: shipkit-secrets
                  key:  GUMROAD_WEBHOOK_TOKEN

          # Health probes
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds:       5
            failureThreshold:    3
            successThreshold:    1

          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds:       15
            failureThreshold:    3

          startupProbe:
            httpGet:
              path: /api/health
              port: 4000
            failureThreshold: 30
            periodSeconds:     5

          volumeMounts:
            - name:      db-data
              mountPath: /app/data
            - name:      products
              mountPath: /products
              readOnly:  true
            - name:      tmp
              mountPath: /tmp
            - name:      logs
              mountPath: /app/logs

      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: shipkit-db-pvc
        - name: products
          hostPath:
            path: /opt/shipkit/products    # mount products dir from node
            type: Directory
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}

      terminationGracePeriodSeconds: 30

---
# ── ServiceAccount for backend ─────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shipkit-backend-sa
  namespace: shipkit
automountServiceAccountToken: false

---
# ── Backend Service ────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: shipkit-backend
  namespace: shipkit
spec:
  selector:
    app:       shipkit
    component: backend
  ports:
    - port:       4000
      targetPort: 4000
      name:       http
  type: ClusterIP

---
# ── Frontend Deployment ────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipkit-frontend
  namespace: shipkit
  labels:
    app:       shipkit
    component: frontend
spec:
  replicas: 2   # Frontend is stateless — can scale freely
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge:       1
      maxUnavailable: 0
  selector:
    matchLabels:
      app:       shipkit
      component: frontend
  template:
    metadata:
      labels:
        app:       shipkit
        component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser:    101   # nginx user
      containers:
        - name: frontend
          image: "ghcr.io/YOUR_USER/shipkit-frontend:latest"
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem:   true
            capabilities:
              drop: ["ALL"]
              add:  ["NET_BIND_SERVICE"]
          resources:
            requests:
              cpu:    "50m"
              memory: "32Mi"
            limits:
              cpu:    "200m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds:       5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds:       20
          volumeMounts:
            - name:      nginx-cache
              mountPath: /var/cache/nginx
            - name:      nginx-run
              mountPath: /var/run
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}

---
# ── Frontend Service ───────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: shipkit-frontend
  namespace: shipkit
spec:
  selector:
    app:       shipkit
    component: frontend
  ports:
    - port:       80
      targetPort: 80
  type: ClusterIP

---
# ── Ingress ────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shipkit-ingress
  namespace: shipkit
  annotations:
    kubernetes.io/ingress.class:              "nginx"
    cert-manager.io/cluster-issuer:           "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps:    "30"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    # Security headers via nginx annotations
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
spec:
  tls:
    - hosts:
        - shipkit.dev
        - www.shipkit.dev
      secretName: shipkit-tls
  rules:
    - host: shipkit.dev
      http:
        paths:
          - path:     /api
            pathType: Prefix
            backend:
              service:
                name: shipkit-backend
                port:
                  number: 4000
          - path:     /
            pathType: Prefix
            backend:
              service:
                name: shipkit-frontend
                port:
                  number: 80

---
# ── HorizontalPodAutoscaler (frontend only — backend is SQLite-bound) ─────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shipkit-frontend-hpa
  namespace: shipkit
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind:       Deployment
    name:       shipkit-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type:               Utilization
          averageUtilization: 70

---
# ── NetworkPolicy — default deny + explicit allow ──────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: shipkit
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-backend
  namespace: shipkit
spec:
  podSelector:
    matchLabels:
      component: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 4000

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-egress-dns
  namespace: shipkit
spec:
  podSelector:
    matchLabels:
      component: backend
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 443    # HTTPS outbound (Gumroad API if needed)

---
# ── PodDisruptionBudget ────────────────────────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shipkit-frontend-pdb
  namespace: shipkit
spec:
  minAvailable: 1
  selector:
    matchLabels:
      component: frontend
