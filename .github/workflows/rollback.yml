
name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Helm revision number to rollback to (run: helm history shipkit -n shipkit)'
        required: true
        type: string

      reason:
        description: 'Reason for rollback'
        required: true
        type: string

      confirm:
        description: 'Type ROLLBACK to confirm'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  CLUSTER_NAME: shipkit-eks
  NAMESPACE: shipkit
  RELEASE_NAME: shipkit
  INGRESS_NAME: shipkit-ingress
  APP_SCHEME: http

jobs:

  # ── Step 1: Validate rollback request ──────────────────────
  validate:
    name: Validate Rollback Request
    runs-on: ubuntu-latest

    env:
      ROLLBACK_REVISION: ${{ inputs.revision }}
      ROLLBACK_REASON: ${{ inputs.reason }}
      ROLLBACK_CONFIRM: ${{ inputs.confirm }}

    steps:
      - name: Validate confirmation and revision
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$ROLLBACK_CONFIRM" != "ROLLBACK" ]]; then
            echo "Confirmation failed."
            echo "Rollback cancelled. No changes made."
            exit 1
          fi

          if [[ ! "$ROLLBACK_REVISION" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid Helm revision: $ROLLBACK_REVISION"
            echo "Enter a positive revision number, such as 3."
            exit 1
          fi

          if [[ -z "$ROLLBACK_REASON" || ! "$ROLLBACK_REASON" =~ [^[:space:]] ]]; then
            echo "Rollback reason cannot be empty."
            exit 1
          fi

          echo "Confirmation accepted."
          echo "Target revision: $ROLLBACK_REVISION"

      - name: Log rollback intent
        shell: bash
        run: |
          echo "====================================="
          echo "ROLLBACK INITIATED"
          echo "====================================="
          echo "Triggered by: $GITHUB_ACTOR"
          echo "Target revision: $ROLLBACK_REVISION"
          echo "Reason: $ROLLBACK_REASON"
          echo "Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "====================================="

  # ── Step 2: Execute Helm rollback on EKS ────────────────────
  rollback:
    name: Execute Helm Rollback
    runs-on: ubuntu-latest
    needs: validate
    environment: production
    timeout-minutes: 15

    env:
      ROLLBACK_REVISION: ${{ inputs.revision }}

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Rollback-${{ github.run_id }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.32.0

      - name: Configure kubectl for EKS
        shell: bash
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --name "$CLUSTER_NAME" \
            --region "$AWS_REGION"

          kubectl cluster-info --request-timeout=10s
          echo "Connected to EKS cluster."

      - name: Verify target Helm revision exists
        shell: bash
        run: |
          set -euo pipefail

          echo "Current Helm history:"
          helm history "$RELEASE_NAME" \
            --namespace "$NAMESPACE" \
            --max 20

          helm history "$RELEASE_NAME" \
            --namespace "$NAMESPACE" \
            --output json |
            jq -e --arg rev "$ROLLBACK_REVISION" \
              'any(.[]; (.revision | tostring) == $rev)' \
              > /dev/null

          echo "Target revision $ROLLBACK_REVISION exists."

      - name: Execute rollback via Helm
        shell: bash
        run: |
          set -euo pipefail

          echo "Rolling back $RELEASE_NAME to revision $ROLLBACK_REVISION"

          helm rollback "$RELEASE_NAME" "$ROLLBACK_REVISION" \
            --namespace "$NAMESPACE" \
            --wait \
            --timeout 5m \
            --cleanup-on-fail \
            --description "Production rollback to revision $ROLLBACK_REVISION"

          echo "Helm rollback command completed successfully."

      - name: Show status after rollback
        shell: bash
        run: |
          set -euo pipefail

          echo "Pods:"
          kubectl get pods --namespace "$NAMESPACE"

          echo ""
          echo "Deployments:"
          kubectl get deployments --namespace "$NAMESPACE"

          echo ""
          echo "Helm history:"
          helm history "$RELEASE_NAME" \
            --namespace "$NAMESPACE" \
            --max 5

      - name: Verify application health through ALB
        shell: bash
        run: |
          set -euo pipefail

          ALB_DNS=$(kubectl get ingress "$INGRESS_NAME" \
            --namespace "$NAMESPACE" \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

          if [[ -z "$ALB_DNS" ]]; then
            echo "ERROR: ALB hostname is not available."
            kubectl get ingress "$INGRESS_NAME" \
              --namespace "$NAMESPACE" || true
            exit 1
          fi

          HEALTH_URL="${APP_SCHEME}://${ALB_DNS}/api/health"

          echo "Checking application health at: $HEALTH_URL"

          for i in $(seq 1 6); do
            HTTP=$(curl -sS -o /dev/null \
              -w "%{http_code}" \
              --max-time 10 \
              "$HEALTH_URL" || true)

            if [[ "$HTTP" == "200" ]]; then
              echo "Application is healthy after rollback."
              echo "Target revision: $ROLLBACK_REVISION"
              exit 0
            fi

            echo "Attempt ${i}/6 - HTTP ${HTTP:-000}"

            if [[ "$i" -lt 6 ]]; then
              sleep 10
            fi
          done

          echo "ERROR: Application health check failed."
          echo "Production may be in a degraded state."
          exit 1

  # ── Step 3: Always write the audit record ──────────────────
  audit:
    name: Rollback Audit Log
    runs-on: ubuntu-latest
    needs: [validate, rollback]
    if: always()

    env:
      ROLLBACK_REVISION: ${{ inputs.revision }}
      ROLLBACK_REASON: ${{ inputs.reason }}

    steps:
      - name: Write audit record
        shell: bash
        run: |
          echo "====================================="
          echo "ROLLBACK AUDIT RECORD"
          echo "====================================="
          echo "Rollback result: ${{ needs.rollback.result }}"
          echo "Validation result: ${{ needs.validate.result }}"
          echo "Triggered by: $GITHUB_ACTOR"
          echo "Target revision: $ROLLBACK_REVISION"
          echo "Reason: $ROLLBACK_REASON"
          echo "Run ID: $GITHUB_RUN_ID"
          echo "Run URL: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "====================================="
