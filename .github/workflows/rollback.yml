name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to roll back to (git commit SHA, a3f2c1b)'
        required: true
        type: string

      reason:
        description: 'Reason for rollback (for audit log)'
        required: true
        type: string

      confirm:
        description: 'Type ROLLBACK to confirm'
        required: true
        type: string
# ── Permissions ────────────────────────────────────────────────
permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:

  validate:
    name: Validate Rollback Request
    runs-on: ubuntu-latest

    steps:
      - name: Verify confirmation word
        run: |
         if [ "${{ inputs.confirm }}" != "ROLLBACK" ]; then
            echo "Confirmation failed"
            echo "You typed: '${{ inputs.confirm }}'"
            echo "Required: 'ROLLBACK'"
            echo ""
            echo "Rollback cancelled no changes made."
            exit 1
          fi
          echo "Confirmation accepted"
      - name: Log rollback intent
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "   ROLLBACK INITIATED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Triggered by: ${{ github.actor }}"
          echo "  Target tag:   ${{ inputs.image_tag }}"
          echo "  Reason:       ${{ inputs.reason }}"
          echo "  Time:         $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━" 
# ------------- Verify the image exists in ECR before touching EC2 --------------
  verify-image:
    name: Verify Image Exists in ECR 
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Rollback-Verify-${{ github.run_id }}
          # Check Backend image 
      - name: Check backend image exists in ECR
        run: |
            IMAGE_TAG="${{ github.event.inputs.image_tag }}"

            echo "Checking ECR for: shipkit-backend:${IMAGE_TAG}"

            # Try to describe the image — fails if it doesn't exist
            aws ecr describe-images \
                --repository-name shipkit-backend \
                --image-ids imageTag=${IMAGE_TAG} \
                --region ${{ env.AWS_REGION }} \
                --query "imageDetails[0].imageTags" \
                --output text
                if [ $? -ne 0 ]; then
            echo " Image shipkit-backend:${IMAGE_TAG} not found in ECR"
            echo "   Cannot rollback to a tag that doesn't exist"
            echo "   Check available tags with:"
            echo "   aws ecr list-images --repository-name shipkit-backend"
            exit 1
            fi
            echo " Backend image confirmed in ECR: ${IMAGE_TAG}"

        # Check frontend image 
      - name: Check frontend image exists in ECR
        run: |
          IMAGE_TAG="${{ github.event.inputs.image_tag }}"

          aws ecr describe-images \
            --repository-name shipkit-frontend \
            --image-ids imageTag=${IMAGE_TAG} \
            --region ${{ env.AWS_REGION }} \
            --query "imageDetails[0].imageTags" \
            --output text

          if [ $? -ne 0 ]; then
            echo " Image shipkit-frontend:${IMAGE_TAG} not found in ECR"
            exit 1
          fi

          echo " Frontend image confirmed in ECR: ${IMAGE_TAG}"
        # This step is critical
# ── Execute rollback ──────────────────────────────────────────

  rollback:
    name: Execute Rollback
    runs-on: ubuntu-latest
    needs: [validate, verify-image]
    environment: production
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Rollback-${{ github.run_id }}

      - name: Get EC2 Instance ID
        id: get-instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=shipkit-ec2" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text \
            --region ${{ env.AWS_REGION }})

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo " Could not find running EC2 instance tagged shipkit-ec2"
            exit 1
          fi

          echo "instance-id=${INSTANCE_ID}" >> $GITHUB_OUTPUT
          echo "Rolling back on instance: ${INSTANCE_ID}"

      - name: Execute rollback via SSM
        id: ssm
        run: |
          IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.get-instance.outputs.instance-id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"/opt/shipkit/scripts/deploy.sh ${IMAGE_TAG}\"
            ]" \
            --comment "ROLLBACK to ${IMAGE_TAG} — ${{ github.event.inputs.reason }}" \
            --timeout-seconds 300 \
            --region "${{ env.AWS_REGION }}" \
            --query "Command.CommandId" \
            --output text)

          echo "command-id=${COMMAND_ID}" >> $GITHUB_OUTPUT
          echo "SSM Command ID: ${COMMAND_ID}"
      - name : Wait for rollback to complete
        run: | 
          COMMAND_ID="${{ steps.ssm.outputs.command-id }}"
          INSTANCE_ID="${{ steps.get-instance.outputs.instance-id }}"
          MAX_WAIT=300
          WAITED=0
          while [ $WAITED -lt $MAX_WAIT ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id ${COMMAND_ID} \
              --instance-id ${INSTANCE_ID} \
              --query "Status" \
              --output text \
              --region ${{ env.AWS_REGION }} 2>/dev/null \
              || echo "Pending")

            echo "Status: ${STATUS} (${WAITED}s elapsed)"

            case $STATUS in
              Success)
                echo " Rollback completed successfully"
            aws ssm get-command-invocation \
                  --command-id ${COMMAND_ID} \
                  --instance-id ${INSTANCE_ID} \
                  --query "StandardOutputContent" \
                  --output text \
                  --region ${{ env.AWS_REGION }}
                break
                ;;
              Failed|Cancelled|TimedOut|DeliveryTimedOut)
                echo " Rollback FAILED — deploy.sh output:"

                aws ssm get-command-invocation \
                  --command-id ${COMMAND_ID} \
                  --instance-id ${INSTANCE_ID} \
                  --query "StandardOutputContent" \
                  --output text \
                  --region ${{ env.AWS_REGION }}

                aws ssm get-command-invocation \
                  --command-id ${COMMAND_ID} \
                  --instance-id ${INSTANCE_ID} \
                  --query "StandardErrorContent" \
                  --output text \
                  --region ${{ env.AWS_REGION }}

                echo ""
                echo "  Rollback failed — production state is UNKNOWN"
                echo "    Investigate EC2 immediately via SSM"
                exit 1
                ;;
              *)
                sleep 10
                WAITED=$((WAITED + 10))
                ;;
            esac
          done
      - name : Verify health after rollback 
        run: | 
          INSTANCE_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=shipkit-ec2" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text \
            --region ${{ env.AWS_REGION }})
           echo "Verifying health at: http://${INSTANCE_IP}/api/health"
           for i in $(seq 1 6); do
            HTTP=$(curl -s -o /dev/null \
              -w "%{http_code}" \
              --max-time 10 \
              "http://${INSTANCE_IP}/api/health" || echo "000")

            if [ "$HTTP" = "200" ]; then
              echo " Application healthy after rollback"
              echo " Running version: ${{ github.event.inputs.image_tag }}"
              exit 0
            fi
            echo "Attempt ${i}/6 — HTTP ${HTTP}"
            sleep 10
          done

          echo " Health check failed after rollback"
          echo "   Production may be in a degraded state"
          echo "   Check EC2 directly via SSM"
          exit 1
# ── Audit summary ─────────────────────────────────────────────
  audit:
    name: Rollback Audit Log
    runs-on: ubuntu-latest
    needs: [validate, verify-image, rollback]
    if: always()
    # Runs regardless of success or failure
    # Creates a permanent audit record in GitHub Actions

    steps:
      - name: Write audit record
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "   ROLLBACK AUDIT RECORD"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Result:      ${{ needs.rollback.result }}"
          echo "  Triggered:   ${{ github.actor }}"
          echo "  Target tag:  ${{ github.event.inputs.image_tag }}"
          echo "  Reason:      ${{ github.event.inputs.reason }}"
          echo "  Run ID:      ${{ github.run_id }}"
          echo "  Run URL:     ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "  Timestamp:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

