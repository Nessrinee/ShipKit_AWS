name: ShipKit CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_BACKEND:  ghcr.io/${{ github.repository_owner }}/shipkit-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/shipkit-frontend

jobs:
  # ────────────────────────────────────────────────────────────────────
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend deps
        run: npm ci
        working-directory: backend

      - name: Lint backend
        run: npm run lint --if-present
        working-directory: backend

      - name: Test backend
        run: npm test --if-present
        working-directory: backend
        env:
          NODE_ENV:        test
          JWT_SECRET:      test-secret-do-not-use-in-prod
          JWT_REFRESH_SECRET: test-refresh-secret
          LICENSE_SECRET:  test-license-secret
          ADMIN_PASSWORD:  test-admin-password

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint --if-present
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: /api

  # ────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Audit backend dependencies
        run: npm audit --audit-level=high
        working-directory: backend

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
        working-directory: frontend

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type:    fs
          scan-ref:     .
          severity:     HIGH,CRITICAL
          exit-code:    "1"
          ignore-unfixed: true

  # ────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BACKEND }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            latest

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context:    backend
          push:       true
          tags:       ${{ steps.meta-backend.outputs.tags }}
          labels:     ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FRONTEND }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context:    frontend
          push:       true
          tags:       ${{ steps.meta-frontend.outputs.tags }}
          labels:     ${{ steps.meta-frontend.outputs.labels }}
          build-args: VITE_API_URL=/api
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/shipkit

            # Pull latest code
            git fetch origin main
            git reset --hard origin/main

            # Pull new images
            docker compose -f docker/docker-compose.prod.yml pull

            # Rolling restart with zero downtime
            docker compose -f docker/docker-compose.prod.yml up -d --no-deps --build backend
            sleep 10
            docker compose -f docker/docker-compose.prod.yml up -d --no-deps --build frontend
            docker compose -f docker/docker-compose.prod.yml up -d --no-deps nginx

            # Clean up old images
            docker image prune -f

            echo "✅ Deployment complete"

      - name: Verify deployment
        run: |
          sleep 15
          curl -f https://${{ secrets.VPS_HOST }}/api/health || exit 1
          echo "✅ Health check passed"
