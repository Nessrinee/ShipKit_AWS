name: CD — Continuous Deployment

on:
  push:
    branches:
      - main
    # Triggers automatically when PR is merged to main
    # Branch protection ensures this only happens via approved PR
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Override image tag (leave empty to use commit SHA)'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}


  # ── Jobs ──────────────────────────────────────────────────
jobs:
 # ── Job 1: Build and Push to ECR ────────────────────────────
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    environment: 
       name: production

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Test CD runner
        run: |
          echo "CD workflow started after PR approval and merge"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Repository: ${{ github.repository }}"
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with: 
          role-to-assume: ${{secrets.AWS_ROLE_ARN}}
          aws-region: ${{env.AWS_REGION}}
          role-session-name: GitHubActions-ShipKit-${{ github.run_id }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        
      - name: Generate image tag from commit SHA 
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          RUN_NUMBER=${{ github.run_number }}
          echo "version=${SHORT_SHA}-${RUN_NUMBER}" >> $GITHUB_OUTPUT
          echo "Building: ${SHORT_SHA}-${RUN_NUMBER}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/shipkit-backend:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/shipkit-frontend:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
# ── Job 2: Deploy to EC2 via SSM ────────────────────────────
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build-and-push
    # Waits for build-and-push to succeed before running
    steps:
      - name: Configure AWS credentials via OIDC 
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Deploy-${{ github.run_id }}
      - name: Get EC2 Instance ID
        id: get-instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=shipkit-ec2" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text \
            --region ${{ env.AWS_REGION }})

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "❌ EC2 instance 'shipkit-ec2' not found or not running"
            exit 1
          fi

          echo "instance-id=${INSTANCE_ID}" >> $GITHUB_OUTPUT
          echo "Deploying to: ${INSTANCE_ID}"
      - name: Deploy via SSM
        id: ssm
        run: | 
         IMAGE_TAG="${{ needs.build-and-push.outputs.image-tag }}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ steps.get-instance.outputs.instance-id }} \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"/opt/shipkit/scripts/deploy.sh ${IMAGE_TAG}\"]" \
            --comment "Deploy ${IMAGE_TAG} — ${{ github.actor }}" \
            --timeout-seconds 300 \
            --region ${{ env.AWS_REGION }} \
            --query "Command.CommandId" \
            --output text)
          echo "command-id=${COMMAND_ID}" >> $GITHUB_OUTPUT
          echo "SSM Command: ${COMMAND_ID}"
      - name: Wait for deployment 
        run: | 
            COMMAND_ID="${{ steps.ssm.outputs.command-id }}"
            INSTANCE_ID="${{ steps.get-instance.outputs.instance-id }}"
            MAX_WAIT=300
            WAITED=0
            while [ $WAITED -lt $MAX_WAIT ]; do
              STATUS=$(aws ssm get-command-invocation \
                --command-id ${COMMAND_ID} \
                --instance-id ${INSTANCE_ID} \
                --query "Status" \
                --output text \
                --region ${{ env.AWS_REGION }} 2>/dev/null || echo "Pending")

              echo "Status: ${STATUS} (${WAITED}s)"
              case $STATUS in
              Success)
                echo " Deployment successful"
                aws ssm get-command-invocation \
                  --command-id ${COMMAND_ID} \
                  --instance-id ${INSTANCE_ID} \
                  --query "StandardOutputContent" \
                  --output text \
                  --region ${{ env.AWS_REGION }}
                break
                ;;
              Failed|Cancelled|TimedOut|DeliveryTimedOut)
                echo " Deployment failed"
                aws ssm get-command-invocation \
                  --command-id ${COMMAND_ID} \
                  --instance-id ${INSTANCE_ID} \
                  --query "StandardOutputContent" \
                  --output text \
                  --region ${{ env.AWS_REGION }}
                aws ssm get-command-invocation \
                  --command-id ${COMMAND_ID} \
                  --instance-id ${INSTANCE_ID} \
                  --query "StandardErrorContent" \
                  --output text \
                  --region ${{ env.AWS_REGION }}
                exit 1
                ;;
              *)
                sleep 10
                WAITED=$((WAITED + 10))
                ;;
            esac
            done


      
