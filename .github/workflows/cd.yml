name: CD — Continuous Deployment

on:
  push:
    branches:
      - main
    # Triggers automatically when PR is merged to main
    # Branch protection ensures this only happens via approved PR
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Override image tag (leave empty to use commit SHA)'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}


  # ── Jobs ──────────────────────────────────────────────────
jobs:
 # ── Job 1: Build and Push to ECR ────────────────────────────
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    environment: 
       name: production

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Test CD runner
        run: |
          echo "CD workflow started after PR approval and merge"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Repository: ${{ github.repository }}"
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with: 
          role-to-assume: ${{secrets.AWS_ROLE_ARN}}
          aws-region: ${{env.AWS_REGION}}
          role-session-name: GitHubActions-ShipKit-${{ github.run_id }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        
      - name: Generate image tag from commit SHA 
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          RUN_NUMBER=${{ github.run_number }}
          echo "version=${SHORT_SHA}-${RUN_NUMBER}" >> $GITHUB_OUTPUT
          echo "Building: ${SHORT_SHA}-${RUN_NUMBER}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/shipkit-backend:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/shipkit-frontend:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  # ── Job 2: Deploy to EKS via Helm ─────────────────────────
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # Need chart files from repo

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Deploy-${{ github.run_id }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --name shipkit-eks \
            --region ${{ env.AWS_REGION }}
          kubectl cluster-info

      - name: Deploy with Helm
        run: |
          IMAGE_TAG="${{ needs.build-and-push.outputs.image-tag }}"

          helm upgrade --install shipkit ./helm/shipkit \
            --namespace shipkit \
            --create-namespace \
            -f ./helm/shipkit/values-production.yaml \
            --set backend.image.tag=${IMAGE_TAG} \
            --set frontend.image.tag=${IMAGE_TAG} \
            --atomic \
            --timeout 5m \
            --wait

          echo " Deployed: ${IMAGE_TAG}"

      - name: Show deployment status
        if: always()
        run: |
          echo "=== Pods ==="
          kubectl get pods -n shipkit

          echo "=== Helm History ==="
          helm history shipkit -n shipkit --max 5

          echo "=== Ingress ==="
          kubectl get ingress -n shipkit

      - name: Verify application health
        run: |
          INSTANCE_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=shipkit-ec2" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text \
            --region ${{ env.AWS_REGION }})

          echo "Health check: http://${INSTANCE_IP}/api/health"

          for i in $(seq 1 6); do
            HTTP=$(curl -s -o /dev/null \
              -w "%{http_code}" \
              --max-time 10 \
              "http://${INSTANCE_IP}/api/health" || echo "000")

            if [ "$HTTP" = "200" ]; then
              echo "✅ Application healthy"
              echo "🚀 Live at: http://${INSTANCE_IP}"
              exit 0
            fi

            echo "Attempt ${i}/6 — HTTP ${HTTP}"
            sleep 10
          done

          echo " Health check failed"
          exit 1


      
