name: CD — Continuous Deployment

on:
  workflow_run:
    workflows: ["CI — Continuous Integration"]
    types:
      - completed

  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:

  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    environment: production

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Test CD runner
        run: |
          echo "CD workflow started"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Repository: ${{ github.repository }}"
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with: 
          role-to-assume: ${{secrets.AWS_ROLE_ARN}}
          aws-region: ${{env.AWS_REGION}}
          role-session-name: GitHubActions-ShipKit-${{ github.run_id }}
      - name: Generate image tag from commit SHA 
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "version=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Image tag: ${SHORT_SHA}"
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Verify ECR repositories
        run: |
          aws ecr describe-repositories \
            --repository-names shipkit-backend shipkit-frontend \
            --region ${{ env.AWS_REGION }}
