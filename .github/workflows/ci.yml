name: CI — Continuous Integration

on:
  pull_request:
    branches:
      - main
    # Run CI on every PR targeting main
    # This is what branch protection checks wait for

# ── Jobs ──────────────────────────────────────────────────────
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # Clones your repository into the runner
        # Without this, the runner has no code to work with

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Run test suite
        working-directory: backend
        run: npm test
        # Add Test 