apiVersion: external-secrets.io/v1beta1
kind: SecretStore # specifies how to access the external API

metadata: 
  name: shipkit-parameter-store
  namespace: {{.value.global.namespace}}
  labels:
  {{- include "shipkit.labels" . | nindent 4}}
#External ressources
spec:
  provider:
    aws:
      service: ParameterStore
      region: {{.Values.global.region}}