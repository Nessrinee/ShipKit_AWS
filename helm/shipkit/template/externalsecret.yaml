apiVersion: external-secrets.io/v1beta1
kind: SecretStore # specifies how to access the external API

metadata: 
  name: shipkit-parameter-store
  namespace: {{.Values.global.namespace}}
  labels:
  {{- include "shipkit.labels" . | nindent 4}}
#External ressources
spec:
  provider:
    aws:
      service: ParameterStore
      region: {{.Values.global.region}}
# specify which store we are using
auth:
  jwt:
    serviceAccountRef:
      name: {{.Values.externalSecrets.serviceAccount.name}}
      namespace: {{.Values.externalSecrets.serviceAccount.namespace }}
---
apiVersion: external-secrets.io/v1beta1
Kind: ExternalSecret #Describes what data should be fetched

metadata:
  name: shipkit-secret
  namespace : {{ .Values.globals.namespace}}

spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
secretStoreRef: #From where we get our Secret
  name: shipkit-parameter-store
  kind: SecretStore
target: #Stock result
  name: shipkit-secrets
  creationPolicy: Owner
data:
  - secretKey: JWT_SECRET
    remoteRef:
      key: {{ .Values.externalSecrets.parameterStorePath }}/jwt-secret
  - secretKey: JWT_REFRESH_SECRET
    remoteRef:
      key: {{ .Values.externalSecrets.parameterStorePath }}/jwt-refresh-secret
  - secretKey: LICENSE_SECRET
    remoteRef:
      key: {{ .Values.externalSecrets.parameterStorePath }}/license-secret
  - secretKey: ADMIN_PASSWORD
    remoteRef:
      key: {{ .Values.externalSecrets.parameterStorePath }}/admin-password
  - secretKey: GUMROAD_WEBHOOK_TOKEN
    remoteRef:
      key: {{ .Values.externalSecrets.parameterStorePath }}/gumroad-webhook-token