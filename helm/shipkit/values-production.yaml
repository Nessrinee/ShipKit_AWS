# Production overrides only
# Everything else inherited from values.yaml

backend:
  replicas: 1
  # SQLite supports one writer only
  # Cannot run multiple backend replicas with shared SQLite
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "1000m"
  # Production gets more resources than default values.yaml
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    # HPA disabled for backend with SQLite
    # Enable only after migrating to PostgreSQL
    # Production can scale higher than default

frontend:
  replicas: 2
  resources:
    requests:
      memory: "64Mi"
      cpu: "100m"
    limits:
      memory: "128Mi"
      cpu: "500m"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6

ingress:
  scheme: internet-facing