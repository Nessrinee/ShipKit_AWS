apiVersion: v1
kind: Service
metadata:
  name: shipkit-frontend
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "shipkit.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "shipkit.frontend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: {{ .Values.frontend.port }}
      protocol: TCP