apiVersion: external-secrets.io/v1
kind: ExternalSecret ##Describes what data should be fetched
metadata:
  name: shipkit-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "shipkit.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef: #From where we get our Secret
    name: shipkit-parameter-store
    kind: SecretStore
  target: #Stock result
    name: shipkit-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef: # map a single specific secret key from your external provider (such as AWS Secrets Manager) into Kubernetes Secret
        key: {{ .Values.externalSecrets.parameterStorePath }}/jwt-secret
    - secretKey: JWT_REFRESH_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.parameterStorePath }}/jwt-refresh-secret
    - secretKey: LICENSE_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.parameterStorePath }}/license-secret
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.parameterStorePath }}/admin-password
    - secretKey: GUMROAD_WEBHOOK_TOKEN
      remoteRef:
        key: {{ .Values.externalSecrets.parameterStorePath }}/gumroad-webhook-token