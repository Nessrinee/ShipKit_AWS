apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipkit-backend
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "shipkit.labels" . | nindent 4 }}
    {{- include "shipkit.backend.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "shipkit.backend.selectorLabels" . | nindent 6 }}

  # Recreate: the EBS volume is ReadWriteOnce and SQLite supports a single
  # writer, so the old pod must stop before the new one mounts the volume
  strategy:
    type: Recreate

  template:
    metadata:
      labels:
        {{- include "shipkit.backend.selectorLabels" . | nindent 8 }}
    spec:
      # fsGroup lets the non-root container (UID 1001) write to the EBS volume
      securityContext:
        fsGroup: 1001
      serviceAccountName: {{ .Values.backend.serviceAccount }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
              protocol: TCP

          envFrom:
            - configMapRef:
                name: shipkit-config
            - secretRef:
                name: shipkit-secrets

          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}

          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false

          {{- if .Values.backend.persistence.enabled }}
          volumeMounts:
            - name: shipkit-db
              mountPath: {{ .Values.backend.persistence.mountPath }}
          {{- end }}

      {{- if .Values.backend.persistence.enabled }}
      volumes:
        - name: shipkit-db
          persistentVolumeClaim:
            claimName: shipkit-db-pvc
      {{- end }}