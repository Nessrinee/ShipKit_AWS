apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipkit-backend
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "shipkit.labels" . | nindent 4 }}
    {{- include "shipkit.backend.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "shipkit.backend.selectorLabels" . | nindent 6 }}

#Deployment strategy RollingUpdate:allows a Deployment update to take place with zero downtime
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1 #specify the maximum number of extra Pods
template:
  metadata:
    labels:
      {{- include "shipkit.backend.selectorLabels" . | nindent 8 }}
  spec:
    serviceAccountName: {{ .Values.backend.serviceAccount }}

containers:
  - name: backend
    image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
    imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
    ports:
      - containerPort: 4000
    env: #Environment Variables
      - name: NODE_ENV
        value: {{ .Values.backend.env.nodeEnv | quote }}
      - name: {{ .Values.backend.port | quote }}
        value: "4000"
      - name: DATABASE_PATH
        value: {{ .Values.backend.env.databasePath | quote }}
      - name: ADMIN_EMAIL
        value: {{ .Values.backend.env.adminEmail | quote }}
    envFrom:
      - secretRef:
          name: shipkit-secrets
    resources:
      {{- toYaml .Values.backend.resources | nindent 12 }}
    livenessProbe: #health checking mechanisms used by Kubernetes to manage the lifecycle, availability, and self-healing behavior of your containers
      httpGet:
        path: /api/health
        port: 4000
      initialDelaySeconds: 15
      periodSeconds: 30
      failureThreshold: 3
    readinessProbe: #a health check in Kubernetes that determines whether a container is ready to accept network traffic.
      httpGet:
        path: /api/health
        port: 4000
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 3
    securityContext:
      runAsNonRoot: true
      runAsUser: 1001
      allowPrivilegeEscalation: false