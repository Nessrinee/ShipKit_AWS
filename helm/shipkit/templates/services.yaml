apiVersion: v1
kind: Service
metadata:
  name: shipkit-backend
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "shipkit.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "shipkit.backend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
      protocol: TCP