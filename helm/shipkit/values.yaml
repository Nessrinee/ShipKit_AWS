#--------------- Global ---------------------------------
global:
  region: eu-west-3
  accountId: "818655836450"
  namespace: shipkit
#--------------- ECR Registry --------------------------
registry: 818655836450.dkr.ecr.eu-west-3.amazonaws.com
#--------------- Backend image --------------------------
backend:
  image:
  repository: 818655836450.dkr.ecr.eu-west-3.amazonaws.com/shipkit-backend
  tag: ""
    # Tag intentionally empty must be provided at deploy time
    # helm upgrade --install ... --set backend.image.tag=e752253-29
    # Never hardcode a tag here
  pullPolicy: Always #The node always contacts the registry to check the image's manifest digest. If a newer digest exists, it pulls the new image.
  replicas: 2
  port: 4000
  env:
    nodeEnv: production
    adminEmail: admin@shipkit.dev
    databasePath: /app/data/shipkit.db
    corsOrigin: ""
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  serviceAccount: shipkit-backend-sa
#---------------- Frontend image -------------------------
frontend:
  image:
    repository: 818655836450.dkr.ecr.eu-west-3.amazonaws.com/shipkit-frontend
    tag: ""
    # Same tag injected at deploy time by CI/CD
    pullPolicy: Always
  replicas: 2
  port: 80
  resources:
    requests:
      memory: "32Mi"
      cpu: "50m"
    limits:
      memory: "64Mi"
      cpu: "250m"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

#---------------- Ingress (ALB) -------------------------
ingress:
  enabled: true
  scheme: internet-facing
  targetType: ip
  listenPorts: '[{"HTTP": 80}]'
  healthcheckPath: /api/health

#---------------- Secrets (External Secrets Operator) -------------------------
externalSecrets:
  refreshInterval: 1h
  parameterStorePath: /shipkit/prod
  serviceAccount:
    name: external-secrets-sa
    namespace: external-secrets
