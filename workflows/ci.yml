name: CI — Continuous Integration

# ── Triggers ──────────────────────────────────────────────────
on:
  pull_request:
    branches:
      - main
    # Run CI on every PR targeting main
    # This is what branch protection checks wait for

# ── Permissions ───────────────────────────────────────────────
permissions:
  contents: read
  # Minimal permissions — CI only reads code, never writes
  # Never give more permissions than needed

# ── Jobs ──────────────────────────────────────────────────────
jobs:

  # ── Job 1: Run Tests ────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    # ubuntu-latest = GitHub-hosted runner
    # Fresh VM per run — no state from previous runs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # Clones your repository onto the runner
        # Without this, the runner has no code to work with

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
          # cache: npm → GitHub caches node_modules between runs
          # Same as Docker layer caching — avoids re-downloading
          # all packages on every PR

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
        # npm ci = clean install from package-lock.json
        # Identical to what Dockerfile does
        # Reproducible — no version drift

      - name: Run test suite
        working-directory: backend
        run: npm test -- --coverage --coverageReporters=text
        # --coverage generates a coverage report
        # --coverageReporters=text prints it inline in the logs
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-not-real
          JWT_REFRESH_SECRET: ci-test-refresh-not-real
          LICENSE_SECRET: ci-test-license-not-real
          ADMIN_EMAIL: admin@test.com
          ADMIN_PASSWORD: TestPassword123!
          CORS_ORIGIN: http://localhost:5173
          # Test environment uses fake secrets
          # Tests run against in-memory SQLite — no real DB
          # These values never touch production

  # ── Job 2: Security Scan ─────────────────────────────────────
  security:
    name: Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dir: backend

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run npm audit
        working-directory: backend
        run: npm audit --audit-level=high
        # --audit-level=high → fail only on HIGH or CRITICAL
        # LOW and MODERATE do not block the PR
        # Same triage logic we applied with Trivy earlier

      - name: Install Trivy
        run: |
          sudo apt-get install wget apt-transport-https gnupg -y
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
            https://aquasecurity.github.io/trivy-repo/deb \
            $(lsb_release -sc) main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install trivy -y

      - name: Scan filesystem for vulnerabilities
        run: |
          trivy fs \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --ignorefile backend/.trivyignore \
            --exit-code 1 \
            backend/
        # trivy fs = scan filesystem (not image)
        # Faster than image scan — no docker build needed in CI
        # exit-code 1 = fail the job if findings exist
        # .trivyignore = our documented accepted risks

  # ── Job 3: Build Check ───────────────────────────────────────
  build-check:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        # Buildx = enhanced Docker build with better caching
        # Used by all production CI pipelines

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          # push: false = build only, do NOT push to ECR
          # CI verifies the build works — CD does the actual push
          tags: shipkit-backend:pr-check
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # type=gha = GitHub Actions cache
          # Caches Docker layers between runs
          # Same benefit as Docker layer caching — faster builds

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: shipkit-frontend:pr-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan built backend image with Trivy
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --ignorefile backend/.trivyignore \
            --exit-code 1 \
            shipkit-backend:pr-check
        # Scan the actual built image — not just filesystem
        # Catches OS-level CVEs that filesystem scan misses
        # (like the OpenSSL issue we fixed earlier)